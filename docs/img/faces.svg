<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330"
     font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#24292f">
  <title>Front and back faces of the plate, and the order of the [front] and [back] layer lists</title>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10"
            markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#24292f"/></marker>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="329" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="34" font-size="15" font-weight="600">Front and back faces, and the order of the layer lists</text>

  <!-- face labels -->
  <text x="210" y="80" text-anchor="middle" font-size="12" fill="#57606a">front face</text>
  <text x="210" y="98" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">[front]</text>
  <text x="578" y="80" text-anchor="middle" font-size="12" fill="#57606a">back face</text>
  <text x="578" y="98" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">[back]</text>

  <!-- front coating: front[0] touches the ambient -->
  <rect x="150" y="110" width="24" height="100" fill="#5b7db8"/>
  <rect x="174" y="110" width="24" height="100" fill="#c3d4ee"/>
  <rect x="198" y="110" width="24" height="100" fill="#5b7db8"/>
  <rect x="222" y="110" width="24" height="100" fill="#c3d4ee"/>
  <rect x="246" y="110" width="24" height="100" fill="#5b7db8"/>
  <!-- substrate -->
  <rect x="270" y="110" width="260" height="100" fill="#e5e7ea"/>
  <text x="400" y="156" text-anchor="middle" font-size="13">substrate</text>
  <text x="400" y="176" text-anchor="middle" font-size="12" fill="#57606a">thickness D</text>
  <!-- back coating: back[0] touches the ambient on the right -->
  <rect x="530" y="110" width="24" height="100" fill="#5b7db8"/>
  <rect x="554" y="110" width="24" height="100" fill="#c3d4ee"/>
  <rect x="578" y="110" width="24" height="100" fill="#5b7db8"/>
  <rect x="602" y="110" width="24" height="100" fill="#c3d4ee"/>
  <rect x="150" y="110" width="476" height="100" fill="none" stroke="#8c959f"/>

  <!-- ambient and incoming light -->
  <text x="90" y="190" text-anchor="middle" font-size="12" fill="#57606a">ambient</text>
  <text x="698" y="190" text-anchor="middle" font-size="12" fill="#57606a">ambient</text>
  <text x="90" y="140" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">side = "front"</text>
  <line x1="36" y1="152" x2="146" y2="152" stroke="#24292f" stroke-width="2" marker-end="url(#ink)"/>
  <text x="698" y="140" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">side = "back"</text>
  <line x1="764" y1="152" x2="630" y2="152" stroke="#24292f" stroke-width="2" marker-end="url(#ink)"/>

  <!-- list indices -->
  <g font-size="11" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#57606a">
    <text x="162" y="228">[0]</text>
    <text x="186" y="228">[1]</text>
    <text x="222" y="228">…</text>
    <text x="258" y="228">[L-1]</text>
    <text x="542" y="228">[M-1]</text>
    <text x="578" y="228">…</text>
    <text x="614" y="228">[0]</text>
  </g>
  <line x1="152" y1="246" x2="268" y2="246" stroke="#57606a" stroke-width="1.5" marker-end="url(#grey)"/>
  <text x="210" y="264" text-anchor="middle" font-size="11" fill="#57606a">list order</text>
  <line x1="624" y1="246" x2="532" y2="246" stroke="#57606a" stroke-width="1.5" marker-end="url(#grey)"/>
  <text x="578" y="264" text-anchor="middle" font-size="11" fill="#57606a">list order</text>

  <text x="24" y="298" font-size="12.5">Both lists start at the air side: materials[0] touches the ambient, the last layer touches the substrate.</text>
  <text x="24" y="317" font-size="12.5" fill="#57606a">So the [back] list reads right to left here. A back face exists only in the incoherent and coherent modes.</text>
</svg>
