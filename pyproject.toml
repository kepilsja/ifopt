[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ifopt"
version = "0.2.0"
description = "Interference filter design: target tables, stable S-matrix engine (JAX), thickness optimisation; scriptable API and CLI"
requires-python = ">=3.14"
dependencies = [
    "jax>=0.7.1",            # first release with CPython 3.14 wheels
    "optax>=0.2.4",
    "numpy>=2.2",
    "scipy>=1.15",
    "matplotlib>=3.10",
    # PyPI tmmax 1.1.4 multiplies layer matrices in the wrong order (wrong R/T for >= 2 layers);
    # master commit dc4b904 contains the fix, so it is pinned here.
    "tmmax @ git+https://github.com/bahremsd/tmmax.git@dc4b90438dffeafd420a7b90c63539813881bedb",
    "tmm>=0.2.0",            # Byrnes' numpy reference implementation (independent cross-check)
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ifopt = "ifopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ifopt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
